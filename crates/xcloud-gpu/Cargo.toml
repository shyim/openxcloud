[package]
name = "xcloud-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true
description = "wgpu video path: zero-copy frame import, WGSL NV12 to RGB, FSR 1.0 upscale, egui texture glue"

[dependencies]
xcloud-media = { workspace = true }
wgpu = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# MetalFX spatial upscaling (`MTLFXSpatialScaler`) as a runtime alternative to the FSR 1.0
# passes. macOS only; a no-op elsewhere.
metalfx = [
    "dep:objc2-metal-fx",
    "dep:block2",
    "objc2-metal/block2",
    "objc2-metal/objc2-core-foundation",
]

# NVIDIA RTX / Intel Video Super Resolution through the D3D11 video processor driver
# extensions, sharing its output with wgpu's DX12 device. Windows only; a no-op elsewhere.
vsr = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
# Same major as wgpu-hal's DX12 backend, so `ID3D12Device` & co. are the same types.
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-video = { workspace = true }
objc2-metal = { workspace = true }
objc2-metal-fx = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }

[dev-dependencies]
eframe = { workspace = true }
triple_buffer = { workspace = true }

[[example]]
name = "replay"
path = "examples/replay.rs"
