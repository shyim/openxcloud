name: Portable transport
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transport:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - name: Protocol and local WebRTC integration tests
        run: cargo test --locked -p xcloud-proto -p xcloud-webrtc
