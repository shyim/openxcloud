name: Desktop checks and packages
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev ffmpeg dpkg-dev libssl-dev python3 \
            libasound2-dev libudev-dev libavcodec-dev libavformat-dev libavutil-dev \
            libavdevice-dev libavfilter-dev libswscale-dev libswresample-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake pkg-config llvm dylibbundler
      - name: Generate synthetic video fixture
        run: bash scripts/generate-test-fixture.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Package desktop app
        run: bash scripts/package.sh
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: OpenXCloud-${{ matrix.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
